name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "web/**"
      - "server/**"

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs never receive secrets, so skip them instead of failing.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Require CLAUDE_CODE_OAUTH_TOKEN
        if: env.HAS_CLAUDE_TOKEN != 'true'
        run: |
          echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is not set. Run: claude setup-token, then gh secret set CLAUDE_CODE_OAUTH_TOKEN"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against docs/agents/code-review.md.
            Done when every changed file is checked against every standard and each finding is posted as an inline comment.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 8
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*)"
