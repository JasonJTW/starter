openapi: 3.1.0
info:
  title: ai-starter server
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
